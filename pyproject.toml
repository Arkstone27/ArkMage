[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ArkMage"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = [
    "llvmlite>=0.50.0",
    "numba>=0.68.1",
    "numpy>=2.5.4",
    "packaging>=26.3",
    "pillow>=13.0.0",
    "pillow-jxl-plugin>=1.3.8",
    "plotly>=7.1.0",
    "pyside6>=6.12.0",
]

[tool.setuptools.packages.find]
where = ["."]